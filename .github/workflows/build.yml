name: Build macOS Executable

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pynput pyautogui  # 寫入你程式有用到的套件

    - name: Build with PyInstaller
      run: |
        python -m PyInstaller --noconfirm --onedir --windowed --name "MacroTool" macro_tool.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MacroTool-macOS
        path: dist/MacroTool.app